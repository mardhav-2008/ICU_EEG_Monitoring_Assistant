[project]
name = "icu-eeg-monitoring-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mardhav-2008", email = "mardhavrayapati81@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.12.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
eeg-prepare = "icu_eeg_monitoring_assistant.cli:prepare"
eeg-prepare-spectrograms = "icu_eeg_monitoring_assistant.cli:prepare_spectrograms"
eeg-train = "icu_eeg_monitoring_assistant.cli:train"
eeg-evaluate = "icu_eeg_monitoring_assistant.cli:evaluate"
eeg-evaluate-fusion = "icu_eeg_monitoring_assistant.cli:evaluate_fusion"
eeg-random-forest = "icu_eeg_monitoring_assistant.cli:random_forest"
eeg-assistant = "icu_eeg_monitoring_assistant.cli:assistant"
eeg-monitor = "icu_eeg_monitoring_assistant.cli:monitor"
eeg-gui = "icu_eeg_monitoring_assistant.cli:gui"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
